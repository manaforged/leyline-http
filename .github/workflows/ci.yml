name: ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'

jobs:
  lint:
    name: comments + fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: verify gates
        run: scripts/verify.sh --only comments,fmt

  msrv:
    name: msrv workspace check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-msrv
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only msrv

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-clippy
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only clippy

  features:
    name: feature matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-features
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only features

  rustdoc:
    name: rustdoc (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-rustdoc
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only doc

  test:
    name: workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-test
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only test

      - name: cargo test (default features)
        run: cargo test -p leyline-http --locked

  api:
    name: API reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-api
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-truesight
        run: cargo install --locked --git https://github.com/manaforged/truesight --rev d7248e66b77adb9d50d92f5a38075cb9ece8581b cargo-truesight

      - name: verify gates
        run: scripts/verify.sh --only api

  platforms:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-platforms-${{ matrix.os }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test (full features)
        run: cargo test -p leyline-http --locked --features full,bench-internals

  musl:
    name: musl (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-musl-${{ matrix.target }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: ${{ matrix.target }}

      - name: cargo check
        run: cargo check -p leyline-http --locked --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test -p leyline-http --lib --locked --target ${{ matrix.target }}

  package:
    name: package + consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-package
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only package

  supply:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-deny

      - name: verify gates
        run: scripts/verify.sh --only deny

  semver:
    name: semver checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-semver
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-semver-checks@0.50.0

      - name: verify gates
        run: scripts/verify.sh --only semver

  benches:
    name: benches compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-benches
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only benches

  fuzz-replay:
    name: fuzz corpus replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-fuzz

      - name: verify gates
        run: scripts/verify.sh --only fuzz-replay

  subcrates:
    name: sub-workspace crates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-subcrates
          workspaces: ". -> target/verify"
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: verify gates
        run: scripts/verify.sh --only subcrates

