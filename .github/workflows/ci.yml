name: ci

# Leyline qualifies releases, not ordinary pushes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: leyline-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'

jobs:
  qualify:
    name: Release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the minimum Rust toolchains
        run: |
          set -euo pipefail
          msrv="$(awk -F'"' '/^rust-version *= *"/{print $2; exit}' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Qualify the release
        run: scripts/verify.sh --full

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master

      # docs.rs builds the published crate with default features on
      # x86_64-unknown-linux-gnu; any rustdoc warning breaks that build, so
      # fail here first. leyline-quiche is excluded like verify.sh.
      - name: rustdoc (docs.rs conditions)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p leyline-http -p leyline-bssl -p leyline-bssl-tokio -p leyline-bssl-sys

      # Doctests compile the README's rust blocks and every ```rust fence in
      # the API docs against the real public API — drift between docs and
      # signatures fails here.
      - name: doctests
        run: cargo test --doc -p leyline-http
