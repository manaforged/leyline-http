name: ci

on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: full
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [full, affected]
        default: affected

concurrency:
  group: leyline-ci-${{ github.ref }}-${{ inputs.scope }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      args: ${{ steps.scope.outputs.args }}
      gate_list: ${{ steps.scope.outputs.gate_list }}
      api: ${{ steps.scope.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Select packages and gates
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$SCOPE" = full ]; then
            args="--workspace --exclude leyline-quiche --features leyline-http/full,leyline-http/bench-internals"
            gates="msrv,features,doc,links,package,deny,semver,benches,fuzz-replay,subcrates"
            api=true
          else
            pkgs=$(node scripts/affected-packages.mjs --base "$BASE" --head "$HEAD" --explain | grep -v '^leyline-quiche$' || true)
            gates=$(node scripts/affected-packages.mjs --base "$BASE" --head "$HEAD" --gates)
            args=""
            for p in $pkgs; do args="$args -p $p"; done
            api=false
            case " $pkgs " in *" leyline-http "*)
              args="$args --features leyline-http/full,leyline-http/bench-internals"
              api=true
              ;;
            esac
          fi
          {
            echo "args=$args"
            printf 'gate_list=%s\n' "$(printf '%s' "$gates" | python3 -c 'import json, sys; print(json.dumps([g for g in sys.stdin.read().strip().split(",") if g]))')"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"
          {
            echo "scope: $SCOPE"
            echo "clippy and test: ${args:-none}"
            echo "gates: ${gates:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: workflow lint
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          file="actionlint_1.7.12_${os}_${arch}.tar.gz"
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/$file" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$file"
          (cd "$dir" && grep " $file\$" "$GITHUB_WORKSPACE/.github/actionlint/checksums.txt" | shasum -a 256 -c -)
          tar -xzf "$dir/$file" -C "$dir" actionlint
          "$dir/actionlint"

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true

      - name: comment lint
        run: python3 scripts/check-comments.py

      - name: profile table
        run: scripts/profile-oneshot.sh docs --check

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: needs.scope.outputs.args != ''
        run: cargo clippy ${{ needs.scope.outputs.args }} --all-targets --locked --no-deps -- -D warnings

  test:
    name: test (Linux)
    needs: scope
    if: needs.scope.outputs.args != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true

      - name: cargo test
        run: cargo test ${{ needs.scope.outputs.args }} --locked

      - name: cargo test (default features)
        if: needs.scope.outputs.api == 'true'
        run: cargo test -p leyline-http --locked

  platforms:
    name: tests (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows'
        with:
          version: 2.16.01

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-platforms-${{ matrix.os }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test (full features)
        env:
          LEYLINE_BSSL_PREBUILT_NASM_OUT: ${{ runner.os == 'Windows' && format('{0}/crates/leyline-bssl-sys/prebuilt/x86_64-pc-windows-msvc', github.workspace) || '' }}
        run: cargo test -p leyline-http --locked --features full,bench-internals

      - name: committed NASM objects are current
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git add -N crates/leyline-bssl-sys/prebuilt
          git diff --exit-code --stat -- crates/leyline-bssl-sys/prebuilt

      - name: build without NASM from the committed objects
        if: runner.os == 'Windows'
        shell: bash
        run: |
          kept=()
          IFS=: read -ra dirs <<<"$PATH"
          for dir in "${dirs[@]}"; do
            [ -e "$dir/nasm" ] || [ -e "$dir/nasm.exe" ] || kept+=("$dir")
          done
          PATH=$(IFS=:; printf '%s' "${kept[*]}")
          if command -v nasm; then echo "nasm is still on PATH"; exit 1; fi
          cargo build -p leyline-bssl-sys --locked --target-dir target/no-nasm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os == 'Windows'
        with:
          name: prebuilt-nasm
          path: crates/leyline-bssl-sys/prebuilt/

  musl:
    name: musl (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-musl-${{ matrix.target }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: ${{ matrix.target }}

      - name: cargo check
        run: cargo check -p leyline-http --locked --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test -p leyline-http --lib --locked --target ${{ matrix.target }}

  gates:
    name: gate (${{ matrix.gate }})
    needs: scope
    if: needs.scope.outputs.gate_list != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.gate_list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-gate-${{ matrix.gate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ matrix.gate == 'fuzz-replay' && 'fuzz -> target' || '. -> target/verify' }}
          cache-workspace-crates: true

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: contains(fromJSON('["deny", "semver", "book"]'), matrix.gate)
        with:
          tool: ${{ matrix.gate == 'deny' && 'cargo-deny@0.20.2' || matrix.gate == 'semver' && 'cargo-semver-checks@0.50.0' || 'mdbook@0.5.4' }}

      - name: lychee
        if: matrix.gate == 'links'
        run: |
          file=lychee-x86_64-unknown-linux-gnu.tar.gz
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/$file" "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/$file"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $dir/$file" | sha256sum -c -
          tar -xzf "$dir/$file" -C "$dir"
          install "$(find "$dir" -type f -name lychee)" "$HOME/.cargo/bin/lychee"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        if: matrix.gate == 'fuzz-replay'
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: matrix.gate == 'fuzz-replay'
        with:
          tool: cargo-fuzz@0.13.2

      - name: verify gate
        run: scripts/verify.sh --only "${{ matrix.gate }}"

  required:
    name: required
    needs: [scope, lint, test, platforms, musl, gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every check passed or was not needed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
