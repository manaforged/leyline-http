name: ci

# Leyline qualifies releases, not ordinary pushes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: leyline-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'

jobs:
  qualify:
    name: Release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the minimum Rust toolchains
        run: |
          set -euo pipefail
          msrv="$(awk -F'"' '/^rust-version *= *"/{print $2; exit}' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal

      - name: Qualify the release
        run: scripts/verify.sh
