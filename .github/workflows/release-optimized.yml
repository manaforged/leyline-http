name: release-optimized

on:
  workflow_dispatch:

permissions:
  contents: read

# PGO + full LTO release build. The profile workload is the comparison
# harness (warm/conc/cold against the local server), so the optimizer
# targets the exact code paths users exercise. Manual rustc PGO flow —
# cargo-pgo's env handling clobbers .cargo/config.toml rustflags and
# breaks the BoringSSL link.
jobs:
  pgo:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install llvm-profdata
        run: |
          PROFDATA=$(find ~/.rustup/toolchains -name llvm-profdata -path "*$PWD*" | head -1)
          echo "PROFDATA=$PROFDATA" >> "$GITHUB_ENV"

      - name: PGO generate build
        run: |
          PROFDATA_DIR=/tmp/pgo-data
          mkdir -p "$PROFDATA_DIR"
          RUSTFLAGS="-Cprofile-generate=$PROFDATA_DIR" \
            cargo build --release -p leyline

      - name: Profile workload (warm / conc / cold phases)
        run: |
          cd benches/comparison
          bash run.sh 2>&1 | tee /tmp/profile-workload.log

      - name: Merge profile
        run: |
          "$PROFDATA" merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data/*.profraw \
            || "${PROFDATA}-unknown-linux-gnu" merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data/*.profraw

      - name: PGO optimized build
        env:
          RUSTFLAGS: -Cprofile-use=/tmp/pgo-data/merged.profdata
        run: cargo build --release -p leyline

      - name: Upload optimized artifact
        uses: actions/upload-artifact@v4
        with:
          name: leyline-pgo-release
          path: target/release/
