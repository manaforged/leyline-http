name: hygiene

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  hygiene:
    if: github.repository == 'manaforged/leyline-http'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository content and change metadata
        env:
          HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          patterns="$RUNNER_TEMP/hygiene.patterns"
          printf '%s\n' "$HYGIENE_PATTERNS" | sed '/^$/d' > "$patterns"
          if [ ! -s "$patterns" ]; then
            echo '::error::Configure the HYGIENE_PATTERNS repository secret.'
            exit 1
          fi
          target=HEAD
          if [ -n "$PR_NUMBER" ]; then
            git fetch --no-tags --no-recurse-submodules origin "+refs/pull/$PR_NUMBER/head"
            target=FETCH_HEAD
          fi
          failed=0
          scan() {
            local status=0
            grep -qiEf "$patterns" "$1" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$2 contains denied text"
              failed=1
            elif [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          }
          while IFS=$'\t' read -r -d '' meta _; do
            read -r _ type object <<<"$meta"
            [ "$type" = blob ] || continue
            git cat-file blob "$object" | strings > "$RUNNER_TEMP/hygiene-content"
            scan "$RUNNER_TEMP/hygiene-content" "Repository content"
          done < <(git ls-tree -r -z "$target")
          if [ -n "$BASE" ] && [[ ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$target"
          elif previous=$(git describe --tags --abbrev=0 --match 'v*' "$target^" 2>/dev/null); then
            range="$previous..$target"
          else
            range="$target"
          fi
          git log --format=%B "$range" > "$RUNNER_TEMP/hygiene-messages"
          scan "$RUNNER_TEMP/hygiene-messages" "Commit messages"
          jq -r '.pull_request.title // "", .pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/hygiene-pr"
          scan "$RUNNER_TEMP/hygiene-pr" "Pull request metadata"
          exit "$failed"
