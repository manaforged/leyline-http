name: version-parity

# Reusable guard: package.json (version + the per-platform optionalDependencies
# pins) and pyproject.toml must never drift from the workspace version (the
# single source of truth in the root Cargo.toml). Called by test.yml on PRs AND
# as a gating job in the release workflows, so a mismatched version — or a
# dangling optionalDependencies pin that would make the prebuilt install fall
# through to source — can never publish. Checkout uses the caller's ref, so on a
# release it validates exactly the tag being published.
on:
  workflow_call:

jobs:
  version-parity:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: check package versions match workspace
        run: |
          WS=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          NPM=$(grep -m1 '"version"' package.json | sed -E 's/.*"([^"]+)".*/\1/')
          PY=$(grep -m1 '^version = ' wrappers/python/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          PY_EXPECT=$(echo "$WS" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')
          [ "$NPM" = "$WS" ] || { echo "package.json $NPM != workspace $WS"; exit 1; }
          [ "$PY"  = "$PY_EXPECT" ] || { echo "pyproject $PY != $PY_EXPECT"; exit 1; }
          echo "version parity OK: $WS"

      - name: check optionalDependencies pin the workspace version
        run: node -e '
          const p = require("./package.json");
          const ws = process.argv[1];
          for (const [k, v] of Object.entries(p.optionalDependencies || {})) {
            if (v !== ws) { console.error(`${k} pins ${v} != workspace ${ws}`); process.exit(1); }
          }
          console.log("optionalDependencies parity OK");
          ' "$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')"
