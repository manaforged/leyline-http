name: bindings

# PR/CI test + smoke for the Node and Python wrappers on the three
# prebuilt-BoringSSL targets (lib tests + clippy, then build & smoke each
# binding). This workflow does NOT publish or produce release artifacts —
# prebuilt distribution is handled by release-node.yml (npm/GitHub Packages)
# and release-python.yml (wheels/PyPI); see docs/RELEASING.md. The live JA4
# wire-parity smoke runs only on manual dispatch (network flake shouldn't
# block PRs); PRs run the offline surface tests via LEYLINE_SKIP_LIVE=1.

on:
  push:
    branches: [main]
    paths:
      - "crates/leyline-ffi/**"
      - "crates/leyline-node/**"
      - "crates/leyline-python/**"
      - "wrappers/**"
      - "package.json"
      - ".github/workflows/bindings.yml"
  pull_request:
    paths:
      - "crates/leyline-ffi/**"
      - "crates/leyline-node/**"
      - "crates/leyline-python/**"
      - "wrappers/**"
      - "package.json"
      - ".github/workflows/bindings.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Empty on manual dispatch (live JA4 parity runs); "1" otherwise (offline only).
  LEYLINE_SKIP_LIVE: ${{ github.event_name == 'workflow_dispatch' && '' || '1' }}

jobs:
  core:
    name: shared core (lib tests + clippy)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (shared core)
        run: cargo test -p leyline-ffi --lib
      - name: cargo clippy (bindings crates)
        run: cargo clippy -p leyline-ffi -p leyline-node -p leyline-python -- -D warnings

  node:
    name: node (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: [self-hosted, Linux, X64]
            target: x86_64-unknown-linux-gnu
          - runs-on: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
          - runs-on: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Self-hosted runners lack the hosted images' implicit build env: macOS
      # cmake lives under Homebrew, and the Windows libclang for the btls-sys
      # BoringSSL bindgen is at C:\tools\LLVM. (The Linux runner already has
      # cmake + clang on PATH.) The runner uses Git-for-Windows bash here.
      - name: self-hosted build env
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then echo "/opt/homebrew/bin" >> "$GITHUB_PATH"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then echo 'LIBCLANG_PATH=C:\tools\LLVM\bin' >> "$GITHUB_ENV"; fi
      - name: Configure MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # --ignore-scripts so the devDependency install doesn't fire `prepare`
      # before the toolchain/MSVC env is in place; we build explicitly next.
      - name: npm install (cli only)
        run: npm install --ignore-scripts
      - name: build addon (release — debug stack-overflows the Chrome147 handshake on Windows)
        run: npm run build
      - name: smoke
        run: npm test

  python:
    name: python (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: [self-hosted, Linux, X64]
            target: x86_64-unknown-linux-gnu
          - runs-on: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
          - runs-on: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: wrappers/python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Self-hosted runners lack the hosted images' implicit build env: macOS
      # cmake lives under Homebrew, and the Windows libclang for the btls-sys
      # BoringSSL bindgen is at C:\tools\LLVM. (The Linux runner already has
      # cmake + clang on PATH.) The runner uses Git-for-Windows bash here.
      - name: self-hosted build env
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then echo "/opt/homebrew/bin" >> "$GITHUB_PATH"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then echo 'LIBCLANG_PATH=C:\tools\LLVM\bin' >> "$GITHUB_ENV"; fi
      - name: Configure MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: install maturin + pytest
        run: python -m pip install --upgrade maturin pytest
      - name: build + install (release abi3 wheel)
        run: maturin build --release --out dist
      - name: install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: pytest
        run: python -m pytest -q
