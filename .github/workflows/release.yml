name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: leyline-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    name: qualify
    uses: ./.github/workflows/ci.yml

  hygiene:
    name: hygiene
    uses: ./.github/workflows/hygiene.yml
    secrets: inherit

  matrix:
    name: matrix
    uses: ./.github/workflows/matrix.yml
    permissions:
      contents: read
      issues: write

  book:
    name: book
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/book.yml
    with:
      deploy: false

  release-check:
    name: release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: verify gates
        run: scripts/verify.sh --only release

  package:
    name: package
    needs: [qualify, hygiene, matrix, release-check, book]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: package
        run: scripts/verify.sh --only release,package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            target/verify/package/*.crate
            target/verify/release-notes.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [package, book]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: release
      url: https://crates.io/crates/leyline-http
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_PACKAGES: dist/package
        run: scripts/verify.sh --only publish

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/package/*.crate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
          dist/package/*.crate

  pages:
    name: pages
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
