name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: leyline-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    name: qualify
    uses: ./.github/workflows/ci.yml

  release-check:
    name: release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: verify gates
        run: scripts/verify.sh --only release

  publish:
    name: publish
    needs: [qualify, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: release
      url: https://crates.io/crates/leyline-http
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: package
        run: scripts/verify.sh --only release,package

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/verify/package/*.crate

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/verify.sh --only publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file target/verify/release-notes.md
          target/verify/package/*.crate

  book:
    name: book
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/book.yml
