name: fingerprint-drift-watch

# Weekly live-fingerprint check against tls.peet.ws to catch upstream
# browser drift between manual re-captures. The pre-commit hook catches
# regressions we introduce; this cron catches drift the upstream browsers
# introduce (e.g. Chrome 147 dropping a SETTINGS parameter between two
# captures, which manifested as a CDN edge soft-blocking affected hosts
# days later as `http2: alpn: negotiated none`).
#
# On failure: opens an issue tagged `fingerprint-drift` so the assignee
# can recapture against real browsers and update the affected TOMLs.

on:
  schedule:
    # Every Monday 09:00 UTC. Weekday so a human can act on the issue
    # within the same day; weekly is dense enough to catch a Chrome
    # roll within a single release window (Chrome ships ~every 4 weeks).
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (full live tls.peet.ws matrix)
        id: livetest
        run: cargo test -p leyline --test tls_peet --release -- --ignored

      - name: Open drift issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `fingerprint-drift: weekly live test failed (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `The weekly live wire-fingerprint test against tls.peet.ws failed.`,
              ``,
              `**What this means:** at least one browser profile in \`crates/leyline/profiles/\` no longer matches the real browser's wire output. Either:`,
              `1. Upstream Chrome / Firefox / Safari shipped a fingerprint change since the last verification.`,
              `2. A leyline change drifted our emission (the pre-commit hook should have caught this; check whether it was bypassed).`,
              ``,
              `**What to do:**`,
              `1. Run \`cargo run --example peet_check --release\` locally and a real browser hitting \`https://tls.peet.ws/api/all\`.`,
              `2. Diff the two for every affected profile.`,
              `3. Update the TOML(s), the \`<browser>_h2_fingerprint\` test in \`crates/leyline/src/h2/config.rs\`, and any per-platform overrides.`,
              `4. The pre-commit hook will verify the fix when you commit.`,
              ``,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['fingerprint-drift', 'bug'],
            });
