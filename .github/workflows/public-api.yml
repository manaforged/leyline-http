name: public-api

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Diff leyline's whole public API surface against the PR base for review. This
  # job is advisory: it prints changed/removed public items so a breaking change
  # is visible in the PR, but does not fail the build — cargo-public-api includes
  # #[doc(hidden)] pub items (h2/pool/core, exposed only for white-box tests), so
  # denying here would freeze internal refactors too. The hard gate is the
  # compile-time guard in crates/leyline/tests/public_api_contract.rs, which pins
  # exactly the accessors downstream depends on and fails the normal test run.
  #
  # cargo-public-api needs nightly rustdoc JSON. The nightly is pinned so diffs
  # are reproducible; bump it deliberately. The repo's rust-toolchain.toml pins
  # stable, so the ephemeral CI checkout drops it for this job.
  public-api-diff:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # the base branch must be present for the diff

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22

      - uses: Swatinem/rust-cache@v2

      # install-action has no recipe for cargo-public-api@0.52.0 (and the
      # cargo-binstall source-compile fallback is flaky), so tolerate an install
      # miss: this whole job is advisory (see header) — the hard gate is the
      # public_api_contract.rs compile-time test. If the tool is unavailable the
      # diff step below simply no-ops rather than failing the run.
      - uses: taiki-e/install-action@v2
        continue-on-error: true
        with:
          tool: cargo-public-api@0.52.0

      - name: Diff public API vs base (advisory)
        continue-on-error: true
        run: |
          rm -f rust-toolchain.toml
          cargo public-api -p leyline diff "origin/${{ github.base_ref }}"
