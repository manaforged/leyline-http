name: prebuilt-rebuild

on:
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Which prebuilts to rebuild: "all", or a comma-separated list of Rust
          target triples (x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu,
          x86_64-pc-windows-msvc).
        required: false
        default: all
        type: string

permissions:
  contents: read

# Rebuilds the BoringSSL prebuilts from the pinned revision + carried patch and
# uploads the artifacts (libs + regenerated bindings + sha256 list) for manual
# commit into crates/leyline-bssl-sys/. Every target must be built with
# -DBORINGSSL_PREFIX=LEYLINE so the whole bundle shares one export namespace.
# aarch64-apple-darwin is built separately; the three targets below
# run here.
jobs:
  linux-x86_64:
    if: inputs.targets == 'all' || contains(inputs.targets, 'x86_64-unknown-linux-gnu')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build golang-go clang libclang-dev llvm nasm

      - name: Build the prebuilt bundle
        run: scripts/package-bssl.sh --target "$TRIPLE"

      - name: Hash the rebuilt artifacts
        run: |
          sha256sum \
            "crates/leyline-bssl-sys/native/$TRIPLE/lib"/* \
            "crates/leyline-bssl-sys/src/bindings/$TRIPLE.rs" \
            | tee "sha256-$TRIPLE.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bssl-prebuilt-x86_64-unknown-linux-gnu
          if-no-files-found: error
          path: |
            crates/leyline-bssl-sys/native/x86_64-unknown-linux-gnu/lib/
            crates/leyline-bssl-sys/src/bindings/x86_64-unknown-linux-gnu.rs
            sha256-x86_64-unknown-linux-gnu.txt

  linux-aarch64:
    if: inputs.targets == 'all' || contains(inputs.targets, 'aarch64-unknown-linux-gnu')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      TRIPLE: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build golang-go clang libclang-dev llvm

      - name: Build the prebuilt bundle
        run: scripts/package-bssl.sh --target "$TRIPLE"

      - name: Hash the rebuilt artifacts
        run: |
          sha256sum \
            "crates/leyline-bssl-sys/native/$TRIPLE/lib"/* \
            "crates/leyline-bssl-sys/src/bindings/$TRIPLE.rs" \
            | tee "sha256-$TRIPLE.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bssl-prebuilt-aarch64-unknown-linux-gnu
          if-no-files-found: error
          path: |
            crates/leyline-bssl-sys/native/aarch64-unknown-linux-gnu/lib/
            crates/leyline-bssl-sys/src/bindings/aarch64-unknown-linux-gnu.rs
            sha256-aarch64-unknown-linux-gnu.txt

  windows-x86_64:
    if: inputs.targets == 'all' || contains(inputs.targets, 'x86_64-pc-windows-msvc')
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TRIPLE: x86_64-pc-windows-msvc
      CMAKE_GENERATOR: Ninja
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      # The carried BoringSSL patch and the submodule sources must stay LF;
      # the runner's default autocrlf rewrites them and git apply fails.
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Puts cl.exe, link.exe, lib.exe, and dumpbin.exe on PATH for every later
      # step, so the build is a native MSVC build and needs no cargo-xwin.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Git Bash puts coreutils `link` ahead of MSVC `link.exe`, so name the
      # MSVC linker for cargo explicitly.
      - name: Point cargo at the MSVC linker
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -like '*Microsoft Visual Studio*' } | Select-Object -First 1).Source
          if (-not $link) { throw "MSVC link.exe not found on PATH" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "MSVC link.exe: $link"

      - name: Install build deps
        shell: pwsh
        run: |
          choco install --no-progress -y ninja nasm llvm strawberryperl
          "C:\Program Files\NASM"          | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin"      | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Strawberry\perl\bin"         | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Show the toolchain
        run: |
          cmake --version
          ninja --version
          perl --version
          go version
          nasm -v
          llvm-nm --version

      # Git Bash runs package-bssl.sh; the script converts paths for cargo and
      # cmake with cygpath and picks llvm-nm (or dumpbin) for the prefix check.
      - name: Build the prebuilt bundle
        run: scripts/package-bssl.sh --target "$TRIPLE"

      - name: Hash the rebuilt artifacts
        run: |
          sha256sum \
            "crates/leyline-bssl-sys/native/$TRIPLE/lib"/* \
            "crates/leyline-bssl-sys/src/bindings/$TRIPLE.rs" \
            | tee "sha256-$TRIPLE.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bssl-prebuilt-x86_64-pc-windows-msvc
          if-no-files-found: error
          path: |
            crates/leyline-bssl-sys/native/x86_64-pc-windows-msvc/lib/
            crates/leyline-bssl-sys/src/bindings/x86_64-pc-windows-msvc.rs
            sha256-x86_64-pc-windows-msvc.txt
