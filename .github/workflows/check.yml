name: check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: leyline-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      args: ${{ steps.scope.outputs.args }}
      gates: ${{ steps.scope.outputs.gates }}
      api: ${{ steps.scope.outputs.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Select affected packages and gates
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pkgs=$(node scripts/affected-packages.mjs --base "$BASE" --head "$HEAD" --explain | grep -v '^leyline-quiche$' || true)
          gates=$(node scripts/affected-packages.mjs --base "$BASE" --head "$HEAD" --gates)
          args=""
          for p in $pkgs; do args="$args -p $p"; done
          api=false
          case " $pkgs " in *" leyline-http "*)
            args="$args --features leyline-http/full,leyline-http/bench-internals"
            api=true
            ;;
          esac
          {
            echo "args=$args"
            echo "gates=$gates"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"
          {
            echo "clippy and test scope: ${args:-none}"
            echo "extra gates: ${gates:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: workflow lint
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          file="actionlint_1.7.12_${os}_${arch}.tar.gz"
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/$file" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$file"
          (cd "$dir" && grep " $file\$" "$GITHUB_WORKSPACE/.github/actionlint/checksums.txt" | shasum -a 256 -c -)
          tar -xzf "$dir/$file" -C "$dir" actionlint
          "$dir/actionlint"

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: check-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: comment lint
        run: python3 scripts/check-comments.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: needs.scope.outputs.args != ''
        run: cargo clippy ${{ needs.scope.outputs.args }} --all-targets --locked --no-deps -- -D warnings

  test:
    name: test (Linux)
    needs: scope
    if: needs.scope.outputs.args != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: check-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test
        run: cargo test ${{ needs.scope.outputs.args }} --locked

  platforms:
    name: test (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: check-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test
        run: cargo test -p leyline-http --lib --locked

  gates:
    name: gates
    needs: scope
    if: needs.scope.outputs.gates != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: check-gates
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ". -> target/verify"

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-deny,cargo-semver-checks,mdbook

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        if: contains(needs.scope.outputs.gates, 'fuzz-replay')
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: contains(needs.scope.outputs.gates, 'fuzz-replay')
        with:
          tool: cargo-fuzz

      - name: verify gates
        run: scripts/verify.sh --only "${{ needs.scope.outputs.gates }}"

  required:
    name: required
    needs: [scope, lint, test, platforms, gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every check passed or was not needed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
