name: check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: leyline-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: workflow lint
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          file="actionlint_1.7.12_${os}_${arch}.tar.gz"
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/$file" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$file"
          (cd "$dir" && grep " $file\$" "$GITHUB_WORKSPACE/.github/actionlint/checksums.txt" | shasum -a 256 -c -)
          tar -xzf "$dir/$file" -C "$dir" actionlint
          "$dir/actionlint"

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: check

      - name: comment lint
        run: python3 scripts/check-comments.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Select affected packages
        id: scope
        run: |
          all=$(node scripts/affected-packages.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --explain)
          pkgs=$(printf '%s\n' "$all" | grep -v '^leyline-quiche$' || true)
          args=""
          for p in $pkgs; do args="$args -p $p"; done
          case " $pkgs " in *" leyline-http "*) args="$args --features leyline-http/full,leyline-http/bench-internals" ;; esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "clippy scope: ${args:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: cargo clippy
        if: steps.scope.outputs.args != ''
        run: cargo clippy ${{ steps.scope.outputs.args }} --all-targets --locked --no-deps -- -D warnings

      - name: cargo test
        if: steps.scope.outputs.args != ''
        run: cargo test ${{ steps.scope.outputs.args }} --locked

      - name: Select extra gates
        id: gates
        run: |
          gates=$(node scripts/affected-packages.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --gates)
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "extra gates: ${gates:-none}" >> "$GITHUB_STEP_SUMMARY"

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: contains(steps.gates.outputs.gates, 'deny')
        with:
          tool: cargo-deny

      - name: Fetch submodules
        if: contains(steps.gates.outputs.gates, 'package')
        run: git submodule update --init --recursive

      - name: verify gates
        if: steps.gates.outputs.gates != ''
        run: scripts/verify.sh --only "${{ steps.gates.outputs.gates }}"
