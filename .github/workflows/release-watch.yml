name: release-watch

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

concurrency:
  group: leyline-release-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    name: browser releases and upstream advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NOTIFY: thomgardiner
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Browser releases without a profile
        run: python3 scripts/release-check.py

      - name: Advisories against the forked crates
        if: ${{ !cancelled() }}
        run: python3 scripts/upstream-check.py

  alert:
    name: open failure issue
    needs: [watch]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'release-watch workflow failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="Run failed on $(date -u +%Y-%m-%d): $RUN_URL"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
