name: release-watch

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

concurrency:
  group: leyline-release-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    name: browser releases and upstream advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NOTIFY: thomgardiner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Browser releases without a profile
        run: python3 scripts/release-check.py

      - name: Advisories against the forked crates
        if: ${{ !cancelled() }}
        run: python3 scripts/upstream-check.py

  capture:
    name: capture new releases
    needs: [watch]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/capture.yml
