name: test

on:
  # PR-only (plus manual dispatch). The merge-to-main push was a duplicate of
  # what the PR already validated — same code, billed twice. Pre-push hooks +
  # the self-hosted gate cover main HEAD; this is the PR backstop.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # package.json (version + optionalDependencies pins) / pyproject.toml must not
  # drift from the workspace version. Single-sourced in version-parity.yml so the
  # same guard gates PRs here and the publish path in the release workflows.
  version-parity:
    uses: ./.github/workflows/version-parity.yml

  # Supply-chain gate: enforce the deny.toml bans (the single-TLS-backend rustls
  # ban) + license allow-list + source allow-list on every push/PR. Offline
  # checks only — advisories need the network and run on the cron/dispatch path,
  # so a flaky DB fetch never blocks a PR.
  deny:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # Workspace unit + integration tests (no live network). Same scope as the
  # rusty-hook pre-commit, so CI catches anything a contributor merged with
  # `--no-verify` or without rusty-hook installed locally.
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace, lib + tests)
        run: cargo test --workspace --exclude leyline-quiche --lib --tests

  # Live wire-fingerprint verification against tls.peet.ws. Only runs for
  # explicit invocations (workflow_dispatch and the weekly cron in
  # fingerprint-cron.yml) — flaky network shouldn't block PRs. The
  # rusty-hook pre-commit already runs this on profile/h2/tls/leyline-bssl-sys
  # changes locally, and pre-push runs the full matrix unconditionally,
  # so this is the third backstop, not the primary gate.
  live-fingerprint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (live tls.peet.ws matrix)
        run: cargo test -p leyline --test tls_peet --release -- --ignored
