name: release-crates

# Publish the Rust crates to crates.io in dependency order:
#   leyline-bssl-sys → leyline-bssl → leyline-bssl-tokio → leyline-quiche → leyline
#
# The binding crates (leyline-ffi, leyline-node, leyline-python) are
# `publish = false`. The owned BoringSSL stack (leyline-bssl-sys, leyline-bssl,
# leyline-bssl-tokio) is excluded from the workspace and published ahead of
# leyline.
#
# leyline-bssl-sys ships prebuilt BoringSSL in its published tarball, so the
# crates.io isolation verify links the static libs directly — no source build,
# no cmake/perl/go. Consumers' `cargo add leyline` is zero-compile for the same
# reason.

on:
  # Manual only. Publishing to crates.io is public and irreversible (no private
  # tier; yank != delete), so this is NEVER fired by an alpha `v*` tag the way
  # release-node/release-python are — it is invoked deliberately at go-live.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "cargo publish --dry-run (no upload)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          # workflow_dispatch is the only trigger, so inputs.dry_run is always set.
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          # Publish each crate, then (on a real publish) poll the index until the
          # just-published version resolves before the next crate depends on it.
          # Treat an already-published version as success so a partial first
          # publish can be resumed (set -e would otherwise abort the re-run).
          #
          # NOTE: on the very first release, a --dry-run of a downstream crate
          # FAILS because its just-built dependency is not yet on crates.io to
          # resolve against. That is expected — run a real (non-dry) publish for
          # the first cut.
          for crate in leyline-bssl-sys leyline-bssl leyline-bssl-tokio leyline-quiche leyline; do
            if ! cargo publish -p "$crate" ${DRY_RUN} 2>publish.err; then
              cat publish.err
              grep -qiE "already (uploaded|exists)" publish.err || exit 1
              echo "$crate already published — continuing"
            fi
            if [ -z "${DRY_RUN}" ] && [ "$crate" != "leyline" ]; then
              V=$(cargo metadata --no-deps --format-version 1 \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);const c=process.argv[1];console.log((m.packages.find(p=>p.name===c)||{}).version||"")})' "$crate")
              echo "waiting for crates.io to index $crate ${V}..."
              for _ in $(seq 1 30); do
                if cargo search "$crate" | grep -q "$crate = \"${V}\""; then break; fi
                sleep 10
              done
            fi
          done
