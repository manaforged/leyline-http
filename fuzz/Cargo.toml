[package]
name = "leyline-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
leyline-h2 = { path = "../crates/h2" }
leyline-cookies = { path = "../crates/cookies" }
bytes = "1"
url = "2"

# Fuzz targets are built with libfuzzer-sys, which wants a bin crate per
# target.  cargo-fuzz auto-discovers these so we don't enumerate them here.
[[bin]]
name = "hpack_integer"
path = "fuzz_targets/hpack_integer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack_header_block"
path = "fuzz_targets/hpack_header_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_frame"
path = "fuzz_targets/h2_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookie_set"
path = "fuzz_targets/cookie_set.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
