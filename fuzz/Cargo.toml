[package]
name = "leyline-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone package — deliberately its own workspace (the benches/ pattern)
# so the fuzz harness and libfuzzer-sys never join the root workspace's
# default builds. Run with:
#
#     cargo +nightly fuzz run <target>          # from the repo root or fuzz/
#     ./scripts/verify.sh --fuzz [SECONDS]      # all targets, time-bounded
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
leyline = { package = "leyline-http", path = "../crates/leyline", features = ["bench-internals"] }
leyline-quiche = { path = "../crates/leyline-quiche" }
tokio = { version = "1", features = ["rt", "io-util"] }
url = "2"

[[bin]]
name = "h2_frame"
path = "fuzz_targets/h2_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack"
path = "fuzz_targets/hpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_continuation"
path = "fuzz_targets/h2_continuation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_head"
path = "fuzz_targets/h1_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_chunked"
path = "fuzz_targets/h1_chunked.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookie"
path = "fuzz_targets/cookie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connect_response"
path = "fuzz_targets/connect_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpack"
path = "fuzz_targets/qpack.rs"
test = false
doc = false
bench = false
