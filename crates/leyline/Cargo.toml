[package]
name = "leyline-http"
description = "HTTP client that mimics browsers on the wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leyline-http"
readme = "../../README.md"

[lib]
name = "leyline"

[package.metadata.docs.rs]
# leyline-bssl-sys ships prebuilt BoringSSL for x86_64-unknown-linux-gnu, so
# docs.rs links the committed libs (no cmake/source build). Document the default
# feature set on one target to stay within docs.rs build limits.
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = [
    "cookies",
    "charset",
    "compression-gzip",
    "compression-brotli",
    "compression-deflate",
    "compression-zstd",
    "multipart",
    "stream",
    "websocket",
    "http3",
    "system-trust",
]
cookies = []
# Charset-aware response-body text decoding (Content-Type charset + BOM, via
# encoding_rs). Off → Response::text falls back to UTF-8 lossy.
charset = ["dep:encoding_rs"]
# Body decompression markers. flate2/zstd are non-optional because the TLS
# layer needs them unconditionally for RFC 8879 certificate decompression
# (zlib/zstd codepoints are fingerprint-bearing); these flags only gate the
# HTTP response-body decompression code paths.
compression-gzip = []
compression-brotli = []
compression-deflate = []
compression-zstd = []
multipart = ["stream", "dep:async-stream"]
stream = []
websocket = ["dep:tungstenite", "dep:tokio-tungstenite"]
http3 = ["dep:leyline-quiche"]
socks = []
system-trust = []
native-interface-bind = []
# Exposes pub bench-only probes into otherwise pub(crate) pool internals
# (checkout + evict path). Off by default; only leyline-benches enables it.
bench-internals = []
tower = ["dep:tower-service"]
full = [
    "cookies",
    "compression-gzip",
    "compression-brotli",
    "compression-deflate",
    "compression-zstd",
    "multipart",
    "stream",
    "websocket",
    "http3",
    "tower",
    "socks",
    "system-trust",
    "native-interface-bind",
    "charset",
]

[dependencies]
# External deps absorbed from sub-crates
# -- from leyline-quiche (external BSD-2 fork, stays as path dep)
leyline-quiche = { path = "../leyline-quiche", version = "=0.1.0", default-features = false, optional = true, features = [
    "boringssl-bssl-crate",
] }

# -- BoringSSL (leyline-owned stack). leyline talks only to the safe wrapper;
# the FFI crate (leyline-bssl-sys) is pulled transitively by leyline-bssl.
leyline-bssl = { workspace = true }
leyline-bssl-tokio = { workspace = true }

# -- async runtime
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "time", "io-util", "macros", "fs", "sync"] }

# -- serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# -- networking / TLS
socket2 = { workspace = true }
url = { workspace = true }

# -- tracing
tracing = { workspace = true }

# -- errors
thiserror = { workspace = true }

# -- crypto / hashing
sha2 = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
hex = "0.4"
md5_legacy = { package = "md5", version = "0.7" }
base64 = { workspace = true }

# -- HTTP / WebSocket
tungstenite = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
http = "1"

# -- misc
bytes = { workspace = true }
encoding_rs = { version = "0.8", optional = true }
# Mozilla Public Suffix List (compile-time embedded) for cookie
# registrable-domain + public-suffix checks. Non-optional: the cookie module
# compiles unconditionally and the list cannot be hand-rolled.
psl = "2"
futures-util = "0.3"
async-stream = { version = "0.3", optional = true }
# Non-optional: h2::client::H2ConnectStream needs PollSender for
# cancel-safe AsyncWrite backpressure (waker survives across polls).
tokio-util = { version = "0.7", features = ["io"] }
lru = "0.18"
rand = "0.8"
libc = "0.2"
tower-service = { version = "0.3", optional = true }

# -- compression (all non-optional: the TLS layer needs flate2/zstd for
#    RFC 8879 certificate decompression regardless of body-compression flags)
flate2 = "1"
brotli = "8"
zstd = "0.13"

# Windows: read the platform trust store via Win32 crypto API.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
bytes = { workspace = true }
# In-test cert generation + a localhost TLS acceptor for the
# pinning hostname-verification integration test.
leyline-bssl = { workspace = true }
leyline-bssl-tokio = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
# Codecs for the in-process httpbin-lite mock (tests/http_semantics.rs) and the
# live H3 streaming test, which decodes the raw streamed body per its
# content-encoding. zstd is a normal dep of leyline but integration tests only
# see dev-deps, so it is restated here.
flate2 = "1"
brotli = "8"
zstd = "0.13"

[package.metadata.cargo-machete]
# imported as `md5` (crate `md-5`); used by the digest-auth MD5 algorithm
ignore = ["md-5"]

[lints]
workspace = true
