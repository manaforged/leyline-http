[package]
name = "leyline-http"
description = "HTTP client that impersonates Chrome, Firefox, and Safari on the wire: TLS (JA3/JA4), HTTP/2, and HTTP/3 fingerprints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leyline-http"
readme = "../../README.md"
exclude = ["profiles/captures/"]

[lib]
name = "leyline"

[package.metadata.cargo_check_external_types]
# Types on the public API that callers are expected to name themselves.
# `url` is the shared URL type of the Rust HTTP ecosystem (reqwest exposes it
# too), so `Jar` takes `url::Url` instead of a wrapper. `tokio::io::AsyncWrite`
# is the sink type of `Response::copy_to`; the crate is tokio-only, so a
# private sink trait would only add a conversion.
allowed_external_types = [
    "http",
    "http::*",
    "bytes::*",
    "serde_core::*",
    "futures_core::*",
    "futures_sink::Sink",
    "url::*",
    "tokio::io::async_write::AsyncWrite",
    "tower_service::*",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = [
    "charset",
    "compression-gzip",
    "compression-brotli",
    "compression-deflate",
    "compression-zstd",
    "multipart",
    "websocket",
    "http3",
    "html",
]
# Charset-aware response-body text decoding (Content-Type charset + BOM, via
# encoding_rs). Off → Response::text falls back to UTF-8 lossy.
charset = ["dep:encoding_rs"]
# Body compression codecs. Each flag also gates the matching RFC 8879
# certificate decompressor in the TLS layer, so a profile that lists a
# cert-compression algorithm whose feature is off fails when the session
# builds instead of silently dropping the codepoint.
compression-gzip = ["dep:flate2"]
compression-brotli = ["dep:brotli"]
compression-deflate = ["dep:flate2"]
compression-zstd = ["dep:zstd"]
multipart = []
websocket = ["dep:tokio-tungstenite"]
http3 = ["dep:leyline-quiche"]
socks = []
# Exposes pub bench-only probes into otherwise pub(crate) pool internals
# (checkout + evict path). Off by default; only leyline-benches enables it.
bench-internals = []
tower = ["dep:tower-service"]
test-util = []
# HTML form extraction (leyline::html) and Tab::submit_form.
html = ["multipart"]
full = ["default", "tower", "socks"]

[dependencies]
# External deps absorbed from sub-crates
# -- from leyline-quiche (external BSD-2 fork, stays as path dep)
leyline-quiche = { workspace = true, optional = true }

# -- BoringSSL (leyline-owned stack). leyline talks only to the safe wrapper;
# the FFI crate (leyline-bssl-sys) is pulled transitively by leyline-bssl.
leyline-bssl = { workspace = true }
leyline-bssl-tokio = { workspace = true }

# -- async runtime
tokio = { workspace = true, features = ["net", "rt", "time", "io-util", "macros", "fs", "sync"] }

# -- serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# -- networking / TLS
socket2 = { workspace = true }
url = { workspace = true, features = ["serde"] }

# -- tracing
tracing = { workspace = true }

# -- errors
thiserror = { workspace = true }

# -- crypto / hashing
sha2 = { workspace = true }
md-5 = { workspace = true }
hex = "0.4"
base64 = { workspace = true }

# -- HTTP / WebSocket
tokio-tungstenite = { workspace = true, optional = true }
http = "1"

# -- misc
bytes = { workspace = true }
encoding_rs = { version = "0.8", optional = true }
# Mozilla Public Suffix List (compile-time embedded) for cookie
# registrable-domain + public-suffix checks. Non-optional: the cookie module
# compiles unconditionally and the list cannot be hand-rolled.
psl = "2.1"
futures-util = { workspace = true }
# Non-optional: h2::client::H2ConnectStream needs PollSender for
# cancel-safe AsyncWrite backpressure (waker survives across polls).
tokio-util = { workspace = true }
lru = "0.18"
rand = "0.9"
libc = "0.2.185"
tower-service = { version = "0.3", optional = true }

# -- compression (optional: each codec is pulled in by its own feature, for
#    both HTTP body compression and RFC 8879 certificate decompression)
flate2 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

# Windows: read the platform trust store via Win32 crypto API.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[[example]]
name = "http3"
required-features = ["http3"]

[[example]]
name = "websocket"
required-features = ["websocket"]

[[example]]
name = "multipart"
required-features = ["multipart"]

[[example]]
name = "accounts"
required-features = ["html"]

[[example]]
name = "browser_tab"
required-features = ["html"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "tls_trust_scope"
required-features = ["bench-internals"]

[[test]]
name = "tls_behaviour"
required-features = ["bench-internals"]

[build-dependencies]
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
leyline-http = { path = ".", features = ["test-util"] }
bytes = { workspace = true }
leyline-quiche = { workspace = true, features = ["internal"] }
# In-test cert generation + a localhost TLS acceptor for the
# pinning hostname-verification integration test.
leyline-bssl = { workspace = true }
leyline-bssl-tokio = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
# Codecs for the in-process httpbin-lite mock (tests/it/http_semantics.rs) and the
# live H3 streaming test, which decodes the raw streamed body per its
# content-encoding. zstd is a normal dep of leyline but integration tests only
# see dev-deps, so it is restated here.
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-machete]
# imported as `md5` (crate `md-5`); used by the digest-auth MD5 algorithm
ignore = ["md-5"]

[lints]
workspace = true
