[meta]
name = "Firefox 151"
browser = "firefox"
version = 151
family = "gecko"
# Real Firefox 151.0 Windows, captured against tls.peet.ws.
# The prior 2026-04-28 profile was a hand-authored 15-cipher list that matched
# no real Firefox and hash-collided with Chrome 149 (dropped both ECDSA CBC
# ciphers + ecdsa_sha1) — corrected here. TLS is byte-identical to real FF152.0.
verified_against = "tls.peet.ws capture 2026-07-07"

[tls]
ciphers = [
    "TLS_AES_128_GCM_SHA256", "TLS_CHACHA20_POLY1305_SHA256", "TLS_AES_256_GCM_SHA384",
    "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256", "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256", "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384", "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA",
    "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA", "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA",
    "TLS_RSA_WITH_AES_128_GCM_SHA256", "TLS_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_RSA_WITH_AES_128_CBC_SHA", "TLS_RSA_WITH_AES_256_CBC_SHA",
]
curves = ["X25519_MLKEM768", "X25519", "SECP256R1", "SECP384R1", "SECP521R1", "ffdhe2048", "ffdhe3072"]
sigalgs = [
    "ecdsa_secp256r1_sha256", "ecdsa_secp384r1_sha384", "ecdsa_secp521r1_sha512",
    "rsa_pss_rsae_sha256", "rsa_pss_rsae_sha384", "rsa_pss_rsae_sha512",
    "rsa_pkcs1_sha256", "rsa_pkcs1_sha384", "rsa_pkcs1_sha512",
    "ecdsa_sha1", "rsa_pkcs1_sha1",
]
delegated_credentials = "ecdsa_secp256r1_sha256:ecdsa_secp384r1_sha384:ecdsa_secp521r1_sha512:ecdsa_sha1"
record_size_limit = 16385
ocsp_stapling = true
signed_cert_timestamps = true
cert_compression = ["zlib", "brotli", "zstd"]
extension_permutation = [0, 23, 65281, 10, 11, 35, 16, 5, 34, 18, 51, 43, 13, 45, 28, 27, 65037]
grease = false
ech_grease = true
pre_shared_key = true

[tls.fingerprint]
# Real Firefox 151.0 Windows (cold first-flight) against tls.peet.ws 2026-07-07.
ja4 = "t13d1617h2_86a278354501_3cbfd9057e0d"

[h2]
header_table_size = 65536
enable_push = false
initial_stream_window_size = 131072
initial_connection_window_size = 12582912
max_frame_size = 16384
pseudo_order = ["method", "path", "authority", "scheme"]
settings_order = [
    "header_table_size", "enable_push", "initial_window_size",
    "max_frame_size", "max_header_list_size", "max_concurrent_streams",
    "unknown8", "unknown9",
]

[h2.fingerprint]
akamai = "1:65536;2:0;4:131072;5:16384|12517377|0|m,p,a,s"

[identity.windows]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:151.0) Gecko/20100101 Firefox/151.0"
sec_ch_ua = ""

[identity.macos]
user_agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:151.0) Gecko/20100101 Firefox/151.0"
sec_ch_ua = ""

