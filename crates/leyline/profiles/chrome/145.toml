[meta]
name = "Chrome 145"
browser = "chrome"
version = 145
variant = "Chrome145"
hello = 146
chromium_major = 145
family = "chromium"
ch_ua_brand = "Google Chrome"
verified_against = "tls.peet.ws"

[tls]
ciphers = [
    "TLS_AES_128_GCM_SHA256", "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256", "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384", "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256", "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA", "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA",
    "TLS_RSA_WITH_AES_128_GCM_SHA256", "TLS_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_RSA_WITH_AES_128_CBC_SHA", "TLS_RSA_WITH_AES_256_CBC_SHA",
]
curves = ["X25519_MLKEM768", "X25519", "SECP256R1", "SECP384R1"]
sigalgs = [
    "ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "rsa_pkcs1_sha256",
    "ecdsa_secp384r1_sha384", "rsa_pss_rsae_sha384", "rsa_pkcs1_sha384",
    "rsa_pss_rsae_sha512", "rsa_pkcs1_sha512",
]
alps = "h2"
alps_new_codepoint = true
ocsp_stapling = true
signed_cert_timestamps = true
cert_compression = ["brotli"]
permute_extensions = true
ech_grease = true
pre_shared_key = true

[tls.fingerprint]
ja4 = "t13d1516h2_8daaf6152771_d8a2da3f94cd"

[h2]
header_table_size = 65536
enable_push = false
max_concurrent_streams = 1000
initial_stream_window_size = 6291456
initial_connection_window_size = 15728640
max_header_list_size = 262144
unknown_setting8 = 1
pseudo_order = ["method", "authority", "scheme", "path"]
settings_order = [
    "header_table_size", "enable_push", "max_concurrent_streams",
    "initial_window_size", "max_frame_size", "max_header_list_size",
    "unknown8", "unknown9",
]
default_priority = { exclusive = true, stream_dependency = 0, weight = 255 }

[h2.fingerprint]
akamai = "1:65536;2:0;3:1000;4:6291456;6:262144;8:1|15663105|0|m,a,s,p"

# Chromium-on-macOS sends only the 4 core SETTINGS (1, 2, 4, 6).
# `max_concurrent_streams` (setting 3) and `unknown_setting8` are both
# absent.
[h2.platforms.macos]
omit_settings = ["max_concurrent_streams", "unknown_setting8"]

[h2.platforms.macos.fingerprint]
akamai = "1:65536;2:0;4:6291456;6:262144|15663105|0|m,a,s,p"

[identity.windows]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36"

[identity.macos]
