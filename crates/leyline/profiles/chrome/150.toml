[meta]
name = "Chrome 150"
browser = "chrome"
version = 150
variant = "Chrome150"
hello = 152
chromium_major = 150
family = "chromium"
ch_ua_brand = "Google Chrome"
verified_against = "Chrome 150.0.7871.128 on macOS via tls.peet.ws"
verified_at = "2026-07-18"
captured_against = "chrome-150.0.7871.128"

[tls]
ciphers = [
    "TLS_AES_128_GCM_SHA256",
    "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA",
    "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA",
    "TLS_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_RSA_WITH_AES_128_CBC_SHA",
    "TLS_RSA_WITH_AES_256_CBC_SHA",
]
curves = ["X25519_MLKEM768", "X25519", "SECP256R1", "SECP384R1"]
# Chrome 150 prepends the ML-DSA post-quantum signature schemes
# (mldsa44/65/87 = 0x0904/0905/0906) ahead of the classical list. This is the
# only signature-algorithm change vs Chrome 149. Requires a BoringSSL revision
# with SSL_SIGN_ML_DSA_* (>= 3a9254f).
sigalgs = [
    "mldsa44",
    "mldsa65",
    "mldsa87",
    "ecdsa_secp256r1_sha256",
    "rsa_pss_rsae_sha256",
    "rsa_pkcs1_sha256",
    "ecdsa_secp384r1_sha384",
    "rsa_pss_rsae_sha384",
    "rsa_pkcs1_sha384",
    "rsa_pss_rsae_sha512",
    "rsa_pkcs1_sha512",
]
alps = "h2"
alps_new_codepoint = true
ocsp_stapling = true
signed_cert_timestamps = true
cert_compression = ["brotli"]
# Chrome randomizes BOTH the ClientHello extension order AND the GREASE
# values per connection (verified against two raw captures from a live
# Chrome 150.0.7871.124 binary: different order, different GREASE
# rotation, different ECH payload length each time). A pinned order or
# seed would be the OPPOSITE of Chrome — leave BoringSSL's per-session
# permutation + random GREASE on.
permute_extensions = true
ech_grease = true
pre_shared_key = true
request_trust_anchors = false

[tls.fingerprint]
ja4 = "t13d1516h2_8daaf6152771_806a8c22fdea"

[h2]
header_table_size = 65536
enable_push = false
initial_stream_window_size = 6291456
max_header_list_size = 262144
initial_connection_window_size = 15728640
pseudo_order = ["method", "authority", "scheme", "path"]
settings_order = ["header_table_size", "enable_push", "initial_window_size", "max_header_list_size"]
# Chrome 150 emits PRIORITY fields (exclusive + weight 256) on each
# request's initial HEADERS frame — captured from a live binary against
# tls.peet.ws (sent_frames: priority.depends_on=0, exclusive=1,
# weight=256). Wire weight = actual - 1 = 255.
default_priority = { exclusive = true, stream_dependency = 0, weight = 255 }

[h2.fingerprint]
akamai = "1:65536;2:0;4:6291456;6:262144|15663105|0|m,a,s,p"

