[meta]
name = "Safari iOS 18"
browser = "safari-ios"
version = 18
family = "webkit"
verified_against = "tls.peet.ws"

[tls]
ciphers = [
    "TLS_AES_128_GCM_SHA256", "TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384", "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384", "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA", "TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA",
    "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA", "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA",
    "TLS_RSA_WITH_AES_256_GCM_SHA384", "TLS_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_RSA_WITH_AES_256_CBC_SHA", "TLS_RSA_WITH_AES_128_CBC_SHA",
    "TLS_ECDHE_ECDSA_WITH_3DES_EDE_CBC_SHA", "TLS_ECDHE_RSA_WITH_3DES_EDE_CBC_SHA",
    "TLS_RSA_WITH_3DES_EDE_CBC_SHA",
]
curves = ["X25519_MLKEM768", "X25519", "SECP256R1", "SECP384R1", "SECP521R1"]
sigalgs = [
    "ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "rsa_pkcs1_sha256",
    "ecdsa_secp384r1_sha384", "ecdsa_sha1",
    "rsa_pss_rsae_sha384", "rsa_pss_rsae_sha512",
    "rsa_pkcs1_sha384", "rsa_pkcs1_sha512", "rsa_pkcs1_sha1",
]
ocsp_stapling = true
signed_cert_timestamps = true
cert_compression = ["brotli"]
pre_shared_key = true

[h2]
enable_push = false
max_concurrent_streams = 100
initial_stream_window_size = 2097152
initial_connection_window_size = 10485760
unknown_setting9 = 1
pseudo_order = ["method", "scheme", "authority", "path"]
settings_order = [
    "enable_push", "max_concurrent_streams", "initial_window_size",
    "unknown9", "header_table_size", "max_frame_size",
    "max_header_list_size", "unknown8",
]

