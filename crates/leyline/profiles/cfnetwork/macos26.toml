[meta]
name = "CFNetwork macOS 26"
browser = "cfnetwork-macos"
version = 26
capture = "native"
variant = "CfnetworkMacOS26"
platform_browser = { ios = "cfnetwork-ios" }
family = "cfnetwork"
verified_against = "CFNetwork/3860.600.21 macOS 26.5.1 first-party loopback pcap"
verified_at = "2026-08-29"
captured_against = "CFNetwork-3860.600.21-Darwin-25.5.0-macOS-26.5.1-25F80"

# First-party URLSession probe pcap (macOS 26.5.1 / Darwin 25F80).
#
# CFNetwork wire quirks in this hello:
#   - one GREASE cipher at the FRONT of the list (BoringSSL grease matches)
#   - TLS 1.3 order AES_256, CHACHA20, AES_128 (via set_tls13_cipher_order)
#   - duplicate rsa_pss_rsae_sha384 (0x0805) in sigalgs — BoringSSL's
#     set_sigalgs must preserve the dup (verified in the live diff test)
#   - supported_groups carries a GREASE group first, then X25519MLKEM768
#   - key_share: GREASE + X25519MLKEM768 + X25519 (BoringSSL keyshare
#     selection for [grease, hybrid, x25519] matches)
#   - compress_certificate = zlib (1) — browsers use brotli; Apple uses zlib
#   - no ALPS, no ECH grease, no padding extension on macOS

[tls]
ciphers = [
    "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256",
    "TLS_AES_128_GCM_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA",
    "TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA",
    "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA",
    "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA",
    "TLS_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_RSA_WITH_AES_256_CBC_SHA",
    "TLS_RSA_WITH_AES_128_CBC_SHA",
    "TLS_ECDHE_ECDSA_WITH_3DES_EDE_CBC_SHA",
    "TLS_ECDHE_RSA_WITH_3DES_EDE_CBC_SHA",
    "TLS_RSA_WITH_3DES_EDE_CBC_SHA",
]
curves = ["X25519_MLKEM768", "X25519", "SECP256R1", "SECP384R1", "SECP521R1"]
sigalgs = [
    "ecdsa_secp256r1_sha256",
    "rsa_pss_rsae_sha256",
    "rsa_pkcs1_sha256",
    "ecdsa_secp384r1_sha384",
    "rsa_pss_rsae_sha384",
    # Deliberate duplicate: CFNetwork advertises 0x0805 twice (captured on
    # the wire by tls.peet.ws and by our own server).
    "rsa_pss_rsae_sha384",
    "rsa_pkcs1_sha384",
    "rsa_pss_rsae_sha512",
    "rsa_pkcs1_sha512",
    "rsa_pkcs1_sha1",
]
ocsp_stapling = true
signed_cert_timestamps = true
cert_compression = ["zlib"]
grease = true
ech_grease = false
pre_shared_key = false
session_tickets = false
permute_extensions = false
# Exact extension order from the capture, excluding the GREASE extensions
# (BoringSSL inserts those first/last itself): server_name, extended_master_
# secret, renegotiation_info, supported_groups, ec_point_formats, alpn,
# status_request, signature_algorithms, signed_certificate_timestamp,
# key_share, psk_key_exchange_modes, supported_versions, compress_certificate
extension_permutation = [0, 23, 65281, 10, 11, 16, 5, 13, 18, 51, 45, 43, 27]

[tls.fingerprint]
ja4 = "t13d2013h2_a09f3c656075_7f0f34a4126d"

[h2]
enable_push = false
initial_stream_window_size = 4194304
max_concurrent_streams = 100
unknown_setting9 = 1
initial_connection_window_size = 10551295  # wire increment 10485760 (10 MiB) = window - 65535, matching CFNetwork
pseudo_order = ["method", "scheme", "path", "authority"]
settings_order = ["enable_push", "initial_window_size", "max_concurrent_streams", "unknown9"]

[h2.fingerprint]
akamai = "2:0;4:4194304;3:100;9:1|10485760|0|m,s,p,a"

[identity.macos]
user_agent = "CFNetwork/3860.600.21 Darwin/25.5.0"
sec_ch_ua = ""

[identity.ios]
user_agent = "CFNetwork/3826.600.41 Darwin/25.5.0"
sec_ch_ua = ""
