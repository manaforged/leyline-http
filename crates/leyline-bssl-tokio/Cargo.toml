[package]
name = "leyline-bssl-tokio"
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
authors = [
    "Thomas Gardiner <thomas@manaforge.tech>",
    "Alex Crichton <alex@alexcrichton.com>",
    "Ivan Nikulin <ifaaan@gmail.com>",
]
description = "Async Tokio TLS streams over leyline-bssl, forked from Cloudflare tokio-boring"
documentation = "https://docs.rs/leyline-bssl-tokio"
keywords = ["boringssl", "tls", "tokio", "async"]
categories = ["cryptography", "asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/manaforged/leyline-http"

[dependencies]
leyline-bssl = { path = "../leyline-bssl", version = "=0.3.0" }
leyline-bssl-sys = { path = "../leyline-bssl-sys", version = "=0.3.0" }
tokio = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
rc_mutex = "deny"
unused_result_ok = "deny"
allow_attributes_without_reason = "deny"
let_underscore_future = "deny"
let_underscore_lock = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"

[lib]
name = "leyline_bssl_tokio"
path = "src/lib.rs"

[package.metadata.upstream]
repo = "cloudflare/boring"
crate = "tokio-boring"
version = "5.2.0"

[workspace]
