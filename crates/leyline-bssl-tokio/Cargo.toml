[package]
name = "leyline-bssl-tokio"
version = "1.0.0-alpha.3"
edition = "2024"
rust-version = "1.88"
authors = [
    "Thomas Gardiner",
    "0x676e67 <gngppz@gmail.com>",
    "Alex Crichton <alex@alexcrichton.com>",
    "Ivan Nikulin <ifaaan@gmail.com>",
]
description = "Async (tokio) SSL streams backed by leyline-bssl / BoringSSL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/manaforged/leyline-http"

[features]
default = ["leyline-bssl/default"]
fips = ["leyline-bssl/fips"]
prefix-symbols = ["leyline-bssl/prefix-symbols"]

[dependencies]
leyline-bssl = { path = "../leyline-bssl", version = "=1.0.0-alpha.3" }
tokio = "1"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[lib]
name = "leyline_bssl_tokio"
path = "src/lib.rs"

[workspace]
