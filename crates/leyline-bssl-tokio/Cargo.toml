[package]
name = "leyline-bssl-tokio"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = [
    "Thomas Gardiner <thomas@manaforge.tech>",
    "0x676e67 <gngppz@gmail.com>",
    "Alex Crichton <alex@alexcrichton.com>",
    "Ivan Nikulin <ifaaan@gmail.com>",
]
description = "Async Tokio TLS streams over leyline-bssl"
homepage = "https://github.com/manaforged/leyline-http"
documentation = "https://docs.rs/leyline-bssl-tokio"
keywords = ["boringssl", "tls", "tokio", "async"]
categories = ["cryptography", "asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/manaforged/leyline-http"

[features]
default = ["leyline-bssl/default"]
fips = ["leyline-bssl/fips"]

[dependencies]
leyline-bssl = { path = "../leyline-bssl", version = "=0.1.0" }
tokio = "1"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[lib]
name = "leyline_bssl_tokio"
path = "src/lib.rs"

[workspace]
