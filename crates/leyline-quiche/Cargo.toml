[package]
name = "leyline-quiche"
# Fork of cloudflare/quiche v0.23.7 that links against leyline-bssl instead of
# boring, so leyline's H2 and H3 ClientHellos share the same patched BoringSSL.
description = "Fork of cloudflare/quiche (v0.23.7) that links against leyline-bssl instead of boring, so leyline's H2 and H3 ClientHellos share the same patched BoringSSL."
version.workspace = true
edition.workspace = true
license = "BSD-2-Clause"
repository.workspace = true
authors = [
    "Alessandro Ghedini <alessandro@ghedini.me>",
    "Thomas Gardiner",
]
build = "src/build.rs"
rust-version = "1.98"
include = [
    "/*.md",
    "/*.toml",
    "/COPYING",
    "/LICENSE",
    "/examples/cert-big.crt",
    "/examples/cert.crt",
    "/examples/cert.key",
    "/examples/rootca.crt",
    "/src",
]

# Vendored third-party code (cloudflare/quiche). Hygiene gates (line caps,
# clippy strictness) do not apply here. We track upstream.

[features]
default = ["boringssl-bssl-crate"]

# Use the BoringSSL library provided by the leyline-bssl crate (replaces
# upstream boringssl-boring-crate). This is the only supported mode in
# leyline-quiche; leyline-bssl-sys owns the BoringSSL build.
boringssl-bssl-crate = ["leyline-bssl", "foreign-types-shared"]

[dependencies]
leyline-bssl = { workspace = true, optional = true }
debug_panic = "0.2.1"
either = { version = "1.8", default-features = false }
foreign-types-shared = { version = "0.3.0", optional = true }
intrusive-collections = "0.9.5"
libc = "0.2"
libm = "0.2"
log = { version = "0.4", features = ["std"] }
octets = "0.3"
slab = "0.4"
smallvec = { version = "1.10", default-features = false }
enum_dispatch = "0.3.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
mio = { version = "0.8", features = ["net", "os-poll"] }
ring = "0.17"
rstest = "0.25"
url = { workspace = true }

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

# Vendored quiche upstream — blanket-allow lint groups to keep upstream diffs
# small and avoid chasing style lints in code we don't own.
[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
style = { level = "allow", priority = -1 }
correctness = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }

[lints.rust]
missing_docs = { level = "allow", priority = -1 }
