[package]
name = "leyline-quic"
description = "HTTP/3 over QUIC with fingerprint control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Cloudflare quiche — BoringSSL-native QUIC + HTTP/3. Via the
# `boringssl-boring-crate` feature and the workspace's `[patch.crates-io]`,
# quiche's `boring` dep resolves to our vendored Leyline fork, so the exact
# same patched BoringSSL emits both the H2 TCP ClientHello and the H3 QUIC
# ClientHello.
quiche = { version = "0.23", default-features = false, features = [
    "boringssl-boring-crate",
] }
boring = { workspace = true }

leyline-profile = { path = "../profile" }
leyline-tls = { path = "../tls" }

bytes = { workspace = true }
tokio = { workspace = true }
http = "1"
tracing = { workspace = true }
futures-util = "0.3"
rand = "0.8"

[[example]]
name = "h3_test"
path = "examples/h3_test.rs"

[lints]
workspace = true
