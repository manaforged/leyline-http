[package]
name = "leyline-quic"
description = "HTTP/3 over QUIC with fingerprint control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Cloudflare quiche — BoringSSL-native QUIC + HTTP/3. Quiche asks crates.io
# for a dep named `boring`; the workspace root `[patch.crates-io]` redirects
# that to our vendored `leyline-ssl` package so the H2 and H3 ClientHellos
# come from the same patched BoringSSL.
quiche = { version = "0.23", default-features = false, features = [
    "boringssl-boring-crate",
] }
boring = { workspace = true }

leyline-profile = { path = "../profile" }
leyline-tls = { path = "../tls" }

bytes = { workspace = true }
tokio = { workspace = true }
http = "1"
tracing = { workspace = true }
futures-util = "0.3"
rand = "0.8"

[[example]]
name = "h3_test"
path = "examples/h3_test.rs"

[lints]
workspace = true
