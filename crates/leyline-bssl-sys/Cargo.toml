[package]
name = "leyline-bssl-sys"
version = "0.1.1"
edition = "2021"
rust-version = "1.96"
authors = [
    "Thomas Gardiner <thomas@manaforge.tech>",
    "Alex Crichton <alex@alexcrichton.com>",
    "Steven Fackler <sfackler@gmail.com>",
    "Ivan Nikulin <ifaaan@gmail.com>",
]
description = "BoringSSL built from source with CMake, and raw FFI bindings, for leyline-http"
homepage = "https://github.com/manaforged/leyline-http"
documentation = "https://docs.rs/leyline-bssl-sys"
readme = "README.md"
keywords = ["boringssl", "tls", "ffi"]
categories = ["cryptography", "external-ffi-bindings"]
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
repository = "https://github.com/manaforged/leyline-http"
build = "build/main.rs"
links = "leyline_bssl"
include = [
    "/Cargo.toml",
    "/README.md",
    "/PROVENANCE.md",
    "/LICENSE-MIT",
    "/NOTICE",
    "/LICENSE-BORINGSSL",
    "/deps/boringssl/third_party/*/LICENSE",
    "/build/*",
    "/src",
    "/bindings/*.rs",
    "/patches",
    "/cmake/*.cmake",
    "/deps/boringssl/**/*.[chS]",
    "/deps/boringssl/**/*.inc",
    "/deps/boringssl/**/*.asm",
    "/deps/boringssl/**/*.pl",
    "/deps/boringssl/**/*.go",
    "/deps/boringssl/**/*.cmake",
    "/deps/boringssl/**/go.mod",
    "/deps/boringssl/**/go.sum",
    "/deps/boringssl/crypto/obj/obj_mac.num",
    "/deps/boringssl/crypto/obj/objects.txt",
    "/deps/boringssl/crypto/err/*.errordata",
    "/deps/boringssl/**/*.bzl",
    "/deps/boringssl/**/*.cc",
    "/deps/boringssl/**/*.cpp",
    "/deps/boringssl/**/*.in",
    "/deps/boringssl/**/CMakeLists.txt",
    "/deps/boringssl/**/sources.cmake",
    "/deps/boringssl/**/util/go_tests.txt",
    "/deps/boringssl/LICENSE",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
bindgen = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.72.0", default-features = false, features = ["runtime"], optional = true }
cc = "1.2"
cmake = "0.1.58"
fslock = "0.2"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(const_fn)"] }

[package.metadata.upstream]
repo = "cloudflare/boring"
crate = "boring-sys"
version = "5.2.0"

[package.metadata.upstream.boringssl]
repo = "google/boringssl"
gitlink = "deps/boringssl"
shared_advisories = { repo = "openssl/release-metadata", path = "secjson", since = "2026-06-21" }

[package.metadata.upstream.boringssl.reviewed]
CVE-2026-14456 = "OpenSSL QUIC server; BoringSSL has no QUIC stack"
CVE-2026-14457 = "raw public keys; BoringSSL offers them only for configured non-X.509 credentials and Leyline configures none"
CVE-2026-18798 = "OpenSSL QUIC server; BoringSSL has no QUIC stack"
CVE-2026-54874 = "DTLS; Leyline does not use DTLS"
CVE-2026-54876 = "OCSP response checking; BoringSSL does not parse OCSP responses"
CVE-2026-63072 = "CMS decryption; BoringSSL CMS only signs"
CVE-2026-63073 = "CMP; BoringSSL has no CMP"
CVE-2026-63074 = "CMP; BoringSSL has no CMP"
CVE-2026-63075 = "OpenSSL QUIC ACK handling; BoringSSL has no QUIC stack"
CVE-2026-63076 = "CMP server; BoringSSL has no CMP"
CVE-2026-75803 = "EVP_Cipher ChaCha20-Poly1305 and AES-OCB; BoringSSL's EVP_CIPHER has neither"
CVE-2026-35189 = "affected; fixed by patches/0006-leyline-crl-relative-name.patch"
CVE-2026-35191 = "OpenSSL QUIC server; BoringSSL has no QUIC stack"
CVE-2026-42772 = "OpenSSL QUIC stream reassembly; BoringSSL has no QUIC stack"
CVE-2026-54872 = "generic scalar multiplication for non-NIST curves; BoringSSL has none"
CVE-2026-54873 = "OpenSSL QUIC stream frames; BoringSSL has no QUIC stack"
CVE-2026-54875 = "SM2; BoringSSL has no SM2"
CVE-2026-72897 = "TLS server SSL_set_SSL_CTX during a handshake; Leyline is a client"
CVE-2026-75804 = "OpenSSL QUIC flow control; BoringSSL has no QUIC stack"
CVE-2026-75805 = "CMP client; BoringSSL has no CMP"
CVE-2026-75806 = "DTLS 1.2; Leyline does not use DTLS"
CVE-2026-77696 = "SM2; BoringSSL has no SM2"
CVE-2026-84782 = "DTLS retransmission; Leyline does not use DTLS"
CVE-2026-84783 = "OpenSSL 4.0 two-phase extension cache; BoringSSL builds the cache under the write lock"
CVE-2026-84784 = "OpenSSL QUIC connection IDs; BoringSSL has no QUIC stack"

[workspace]
