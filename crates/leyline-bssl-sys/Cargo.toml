[package]
name = "leyline-bssl-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
authors = [
    "Thomas Gardiner <thomas@manaforge.tech>",
    "Alex Crichton <alex@alexcrichton.com>",
    "Steven Fackler <sfackler@gmail.com>",
    "Ivan Nikulin <ifaaan@gmail.com>",
]
description = "BoringSSL built from source with CMake, and raw FFI bindings, for leyline-http"
homepage = "https://github.com/manaforged/leyline-http"
documentation = "https://docs.rs/leyline-bssl-sys"
readme = "README.md"
keywords = ["boringssl", "tls", "ffi"]
categories = ["cryptography", "external-ffi-bindings"]
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
repository = "https://github.com/manaforged/leyline-http"
build = "build/main.rs"
links = "leyline_bssl"
include = [
    "/Cargo.toml",
    "/README.md",
    "/PROVENANCE.md",
    "/LICENSE-MIT",
    "/LICENSE-BORINGSSL",
    "/build/*",
    "/src",
    "/patches",
    "/cmake/*.cmake",
    "/deps/boringssl/**/*.[chS]",
    "/deps/boringssl/**/*.inc",
    "/deps/boringssl/**/*.asm",
    "/deps/boringssl/**/*.pl",
    "/deps/boringssl/**/*.go",
    "/deps/boringssl/**/*.cmake",
    "/deps/boringssl/**/go.mod",
    "/deps/boringssl/**/go.sum",
    "/deps/boringssl/crypto/obj/obj_mac.num",
    "/deps/boringssl/crypto/obj/objects.txt",
    "/deps/boringssl/crypto/err/*.errordata",
    "/deps/boringssl/**/*.bzl",
    "/deps/boringssl/**/*.cc",
    "/deps/boringssl/**/*.cpp",
    "/deps/boringssl/**/*.in",
    "/deps/boringssl/**/CMakeLists.txt",
    "/deps/boringssl/**/sources.cmake",
    "/deps/boringssl/**/util/go_tests.txt",
    "/deps/boringssl/LICENSE",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
bindgen = { version = "0.72.0", default-features = false, features = ["runtime"] }
cc = "1.2"
cmake = "0.1.58"
fs_extra = "1.3.0"
fslock = "0.2"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(const_fn)"] }

[workspace]
