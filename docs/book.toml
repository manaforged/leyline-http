[book]
title = "Leyline"
description = "User guide for leyline-http, a fast async HTTP/1.1, HTTP/2, and HTTP/3 client for Rust with sessions, crawling, DoH/ECH, proxies, and browser TLS profiles"
src = "."
authors = ["Manaforge Technologies, LLC"]
language = "en"

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/manaforged/leyline-http"
edit-url-template = "https://github.com/manaforged/leyline-http/edit/main/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/leyline.css"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
use-boolean-and = true
