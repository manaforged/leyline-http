<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bench-light-title bench-light-desc" viewBox="0 0 920 316" width="920" height="316">
  <title id="bench-light-title">Leyline HTTP/2 throughput, browser profile speed, and client CPU per request</title>
  <desc id="bench-light-desc">Left panel compares HTTP/2 throughput across general clients (Leyline 1,397,935 req/s vs hyper-util 1,148,891, reqwest 861,386, libcurl 653,651, Go net/http 577,833). Right panel compares Chrome 146 browser-profile throughput (Leyline 1,077,095 req/s vs wreq 686,757 and tls-client 272,135) and open-loop client CPU per request at 50k req/s (Leyline 7.96 µs vs hyper-util 12.88 µs and reqwest 18.90 µs).</desc>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="919" height="315" rx="8" fill="#ece7dc" stroke="#1c1d1a" stroke-opacity="0.24"/>

  <!-- Left Panel: General HTTP/2 -->
  <text x="24" y="32" fill="#1c1d1a" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">General HTTP/2 throughput (8×256)</text>
  <text x="444" y="32" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">req/s · sequential</text>
  <line x1="24" y1="44" x2="444" y2="44" stroke="#1c1d1a" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Leyline: 1,397,935 -->
  <text x="106" y="81.5" fill="#1c1d1a" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="end">Leyline</text>
  <rect x="116" y="64" width="233" height="26" rx="4" fill="#5f7a2e" fill-opacity="0.16" stroke="#4c6422" stroke-width="1.5"/>
  <text x="357" y="81.5" fill="#4c6422" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600">1.40M</text>
  <text x="444" y="81.5" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">53.3k</text>

  <!-- hyper-util: 1,148,891 -->
  <text x="106" y="119.5" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">hyper-util</text>
  <rect x="116" y="102" width="191" height="26" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="315" y="119.5" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">1.15M</text>
  <text x="444" y="119.5" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">43.3k</text>

  <!-- reqwest: 861,386 -->
  <text x="106" y="157.5" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">reqwest</text>
  <rect x="116" y="140" width="144" height="26" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="268" y="157.5" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">861k</text>
  <text x="444" y="157.5" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">35.7k</text>

  <!-- libcurl: 653,651 -->
  <text x="106" y="195.5" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">libcurl</text>
  <rect x="116" y="178" width="109" height="26" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="233" y="195.5" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">654k</text>
  <text x="444" y="195.5" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">44.0k</text>

  <!-- Go net/http: 577,833 -->
  <text x="106" y="233.5" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">Go net/http</text>
  <rect x="116" y="216" width="96" height="26" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="220" y="233.5" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">578k</text>
  <text x="444" y="233.5" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">40.0k</text>

  <!-- Center Divider -->
  <line x1="468" y1="20" x2="468" y2="296" stroke="#1c1d1a" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Right Panel Top: Browser Profiles -->
  <text x="492" y="32" fill="#1c1d1a" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">With Chrome TLS + HTTP/2 profile</text>
  <text x="896" y="32" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">8×256 req/s</text>
  <line x1="492" y1="44" x2="896" y2="44" stroke="#1c1d1a" stroke-opacity="0.12" stroke-width="1"/>

  <text x="566" y="81.5" fill="#1c1d1a" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="end">Leyline</text>
  <rect x="576" y="64" width="215" height="26" rx="4" fill="#5f7a2e" fill-opacity="0.16" stroke="#4c6422" stroke-width="1.5"/>
  <text x="799" y="81.5" fill="#4c6422" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600">1,077,095</text>

  <text x="566" y="117.5" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">wreq</text>
  <rect x="576" y="100" width="137" height="26" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="721" y="117.5" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">686,757 (1.57×)</text>

  <text x="566" y="153.5" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">tls-client</text>
  <rect x="576" y="136" width="54" height="26" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="638" y="153.5" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">272,135 (3.95×)</text>

  <!-- Right Panel Bottom: Client CPU / req at 50k req/s -->
  <text x="492" y="194" fill="#1c1d1a" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">Client CPU per request at 50k req/s</text>
  <text x="896" y="194" fill="#5c5a54" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" text-anchor="end">lower is better</text>
  <line x1="492" y1="205" x2="896" y2="205" stroke="#1c1d1a" stroke-opacity="0.12" stroke-width="1"/>

  <text x="566" y="231" fill="#1c1d1a" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="end">Leyline</text>
  <rect x="576" y="216" width="95" height="22" rx="4" fill="#5f7a2e" fill-opacity="0.16" stroke="#4c6422" stroke-width="1.5"/>
  <text x="679" y="231" fill="#4c6422" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600">7.96 µs</text>

  <text x="566" y="259" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">hyper-util</text>
  <rect x="576" y="244" width="154" height="22" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="738" y="259" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">12.88 µs</text>

  <text x="566" y="287" fill="#5c5a54" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="end">reqwest</text>
  <rect x="576" y="272" width="226" height="22" rx="4" fill="#5c5a54" fill-opacity="0.13" stroke="#5c5a54" stroke-opacity="0.45" stroke-width="1"/>
  <text x="810" y="287" fill="#1c1d1a" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11">18.90 µs</text>

  <!-- Left Footer Note -->
  <text x="24" y="287" fill="#7d796f" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5">run_per_core reaches 1.43M HTTP/2 req/s and 944k HTTP/1.1 req/s</text>
</svg>
