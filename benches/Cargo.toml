[package]
name = "leyline-benches"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone package — deliberately excluded from the workspace via the
# workspace root's `[workspace.exclude]` so `cargo build` at the root stays
# fast and criterion's transitive deps (plotters, tinytemplate, rayon) don't
# get pulled into every library build. Run with:
#
#     cargo bench -p leyline-benches --manifest-path benches/Cargo.toml
#
# or from this directory: `cargo bench`.
[workspace]

# Mirror the workspace-root patches so that quiche's transitive `boring` /
# `boring-sys` deps resolve to Leyline's vendored fork (same links = boringssl
# target, or cargo fails with a native-library conflict). Patches don't cross
# workspace boundaries — each excluded workspace needs its own copy.
[patch.crates-io]
boring = { path = "../vendor/leyline-ssl" }
boring-sys = { path = "../vendor/leyline-ssl-sys" }
tokio-boring = { path = "../vendor/tokio-leyline-ssl" }

[dependencies]
leyline = { path = "../crates/leyline" }
leyline-audit = { path = "../crates/audit" }
leyline-h2 = { path = "../crates/h2" }
leyline-pool = { path = "../crates/pool" }
leyline-profile = { path = "../crates/profile" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "io-util", "sync", "time"] }
# Peer for HPACK head-to-head. h2 keeps its HPACK primitives private, so the
# comparison bench gracefully degrades to a note (see hpack_vs_h2.rs).
h2 = "0.4"

[[bench]]
name = "hpack"
harness = false

[[bench]]
name = "audit"
harness = false

[[bench]]
name = "frames"
harness = false

[[bench]]
name = "profile"
harness = false

[[bench]]
name = "session"
harness = false

[[bench]]
name = "multiplex"
harness = false

[[bench]]
name = "hpack_vs_h2"
harness = false

[[bench]]
name = "allocs"
harness = false

[[bench]]
name = "pool"
harness = false
