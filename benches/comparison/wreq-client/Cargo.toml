[package]
name = "wreq-cmp-client"
version = "0.0.0"
edition = "2024"
publish = false

# Detached workspace: wreq vendors its own BoringSSL (links = "boring"), which
# would collide with leyline-bssl-sys (links = "boringssl") if linked into one
# binary — so wreq lives in its own process, never the same build graph.
[workspace]

[dependencies]
wreq = "=6.0.0-rc.31"
wreq-util = "=3.0.0-rc.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = "fat"
codegen-units = 1
