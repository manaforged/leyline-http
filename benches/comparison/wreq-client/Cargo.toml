[package]
name = "wreq-cmp-client"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
wreq = { version = "=0.16.3", features = ["gzip", "brotli", "zstd", "deflate"] }
wreq-util = { version = "=0.2.0", features = ["emulation-serde", "emulation-compression"] }
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
