[package]
name = "leyline-qualification"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "qualify"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pingora-core = { version = "=0.9.0", default-features = false, features = ["rustls"] }
pingora-http = "=0.9.0"
leyline = { package = "leyline-http", path = "../../crates/leyline" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
serde_json = "1"
hdrhistogram = { version = "7", default-features = false }

[profile.quick]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true
debug = false
