[package]
name = "ergo-wreq"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
wreq = { version = "=0.16.3", features = ["json", "cookies", "multipart", "stream"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
serde_json = "1"
futures = "=0.3.31"
