[workspace]
resolver = "2"
members = [
    "crates/leyline",
    "crates/core",
    "crates/tls",
    "crates/h2",
    "crates/pool",
    "crates/profile",
    "crates/tcp",
    "crates/cookies",
    "crates/audit",
    "crates/ffi",
    "crates/quic",
    "crates/cli",
]
exclude = [
    "wrappers/*",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.85" # MSRV
authors = ["Manaforge Technologies, LLC"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/manaforged/leyline-http"
homepage = "https://github.com/manaforged/leyline-http"
keywords = ["tls", "fingerprint", "http", "browser", "ja4"]
categories = ["web-programming::http-client", "cryptography"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
thiserror = "2"
url = "2"
sha2 = "0.10"
boring = { path = "vendor/leyline-ssl" }
boring-sys = { path = "vendor/leyline-ssl-sys" }
tokio-boring = { path = "vendor/tokio-leyline-ssl" }
socket2 = "0.5"
bytes = "1"
tungstenite = "0.26"
tokio-tungstenite = "0.26"
sha1 = "0.10"
# CLI-only deps (only pulled by crates/cli; keep them out of the library path)
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5"
anstream = "0.6"
owo-colors = { version = "4", features = ["supports-colors"] }
humantime = "2.1"
anyhow = "1"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# Route every crate in the graph (including quiche) through our patched
# BoringSSL fork. Without this, quiche would pull stock cloudflare/boring
# from crates.io and its QUIC ClientHello would diverge from our H2 one.
[patch.crates-io]
boring = { path = "vendor/leyline-ssl" }
boring-sys = { path = "vendor/leyline-ssl-sys" }
tokio-boring = { path = "vendor/tokio-leyline-ssl" }
