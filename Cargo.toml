[workspace]
resolver = "2"
members = [
    "crates/leyline",
    "crates/leyline-ffi",
    "crates/leyline-node",
    "crates/leyline-python",
    "crates/leyline-quiche",
]

exclude = [
    "crates/leyline-bssl-sys",
    "crates/leyline-bssl",
    "crates/leyline-bssl-tokio",
]
[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98" # MSRV
authors = ["Thomas Gardiner <thomas@manaforge.tech>"]
license = "MIT"
repository = "https://github.com/manaforged/leyline-http"
homepage = "https://github.com/manaforged/leyline-http"
keywords = ["tls", "fingerprint", "http", "browser", "ja4"]
categories = ["web-programming::http-client", "cryptography"]

[workspace.lints.rust]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
rc_mutex = "deny"

[workspace.dependencies]
tokio = { version = "1.32", features = ["net", "rt", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1.36"
thiserror = "2"
url = "2"
sha2 = "0.10"
md-5 = "0.10"
# Leyline's owned BoringSSL stack (vendored fork of 0x676e67/btls). Carries the
# Firefox-specific C patches (record_size_limit, delegated_credentials, FFDHE,
# 3DES) and pins the BoringSSL revision per Chrome era. Attribution in /NOTICE.
leyline-bssl = { path = "crates/leyline-bssl", version = "=1.0.0-alpha.3" }
leyline-bssl-sys = { path = "crates/leyline-bssl-sys", version = "=1.0.0-alpha.3" }
leyline-bssl-tokio = { path = "crates/leyline-bssl-tokio", version = "=1.0.0-alpha.3" }
socket2 = { version = "0.5", features = ["all"] }
bytes = "1"
tungstenite = "0.26"
tokio-tungstenite = "0.26"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
