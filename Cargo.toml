[workspace]
resolver = "2"
members = [
    "crates/leyline",
    "crates/leyline-ffi",
    "crates/leyline-node",
    "crates/leyline-python",
    "crates/leyline-quiche",
]

exclude = [
    "crates/btls-sys",
]
[workspace.package]
version = "1.0.0-alpha.2"
edition = "2024"
rust-version = "1.85" # MSRV
authors = ["Thomas Gardiner"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/manaforged/leyline-http"
homepage = "https://github.com/manaforged/leyline-http"
keywords = ["tls", "fingerprint", "http", "browser", "ja4"]
categories = ["web-programming::http-client", "cryptography"]

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
thiserror = "2"
url = "2"
sha2 = "0.10"
md-5 = "0.10"
# BoringSSL bindings from crates.io. btls is a fork of 0x676e67/boring2 that
# carries the Firefox-specific C patches (set_record_size_limit,
# set_delegated_credentials) we need for browser-accurate TLS fingerprinting.
# Upstream attribution is in /NOTICE.
btls = "0.5.6"
btls-sys = "0.5.6"
tokio-btls = "0.5.6"
socket2 = { version = "0.5", features = ["all"] }
bytes = "1"
tungstenite = "0.26"
tokio-tungstenite = "0.26"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[patch.crates-io]
# Keep normal developer builds off CMake/bindgen/libclang; see crates/btls-sys.
btls-sys = { path = "crates/btls-sys" }
